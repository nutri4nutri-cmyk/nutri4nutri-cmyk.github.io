<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel administrativo — Nutri For Nutri</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet"><style>
:root{--ink:#0d0c0a;--gold:#c7a16a;--cream:#f7f4ed;--green:#8da88c}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:14px Inter,sans-serif}.top{background:var(--ink);color:white;padding:18px 5vw;display:flex;align-items:center;gap:18px}.brand{font:italic 25px 'Cormorant Garamond';color:var(--gold)}.top a{margin-left:auto;color:#ddd;text-decoration:none}.wrap{max-width:1200px;margin:35px auto;padding:0 22px}.card{background:#fff;border:1px solid #e8e1d5;border-radius:16px;padding:24px;box-shadow:0 12px 35px #33260e10}.login{max-width:500px;margin:9vh auto}.hidden{display:none!important}h1,h2{margin-top:0}h1{font:600 40px 'Cormorant Garamond'}label{font-weight:600;font-size:12px;display:block;margin:14px 0 6px}input,textarea,select{width:100%;border:1px solid #dcd4c6;border-radius:9px;padding:11px;background:#fff;font:inherit}textarea{min-height:120px}button,.btn{border:0;border-radius:9px;background:var(--ink);color:white;padding:11px 17px;font-weight:700;cursor:pointer}.gold{background:var(--gold);color:var(--ink)}.muted{color:#766f64;font-size:12px}.tabs{display:flex;gap:8px;margin:20px 0}.tabs button.active{background:var(--gold);color:var(--ink)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.stat b{display:block;font-size:32px;color:var(--gold)}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.list{display:grid;gap:12px;margin-top:18px}.item{border:1px solid #ece5d9;border-radius:12px;padding:15px}.item-head{display:flex;justify-content:space-between;gap:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.actions button{padding:8px 12px}.danger{background:#8b3d3d}.reply{background:#f7f4ed;padding:10px;border-left:3px solid var(--gold);margin-top:8px}.notice{padding:10px;border-radius:8px;margin:12px 0;background:#efe9dc}.ok{background:#e5f0e4}.err{background:#f6dfdc}@media(max-width:760px){.grid,.row{grid-template-columns:1fr}.top{flex-wrap:wrap}.top a{margin-left:0}}
</style></head><body><header class="top"><span class="brand">Nutri For Nutri</span><b>Painel administrativo</b><a href="player.html?c=comunidade">Ver como aluna →</a></header><main class="wrap">
<section id="login" class="card login"><h1>Acesso da produtora</h1><p>Entre com um dos e-mails autorizados. Enviaremos um código válido por 10 minutos.</p><div id="login-msg"></div><label>E-mail</label><input id="email" type="email"><button class="gold" onclick="sendCode()" style="margin-top:14px">Enviar código</button><div id="code-box" class="hidden"><label>Código recebido</label><input id="code" inputmode="numeric" maxlength="6"><button onclick="verifyCode()" style="margin-top:14px">Entrar no painel</button></div></section>
<section id="panel" class="hidden"><h1>Gestão da comunidade</h1><p id="who" class="muted"></p><div class="tabs"><button class="active" onclick="tab('overview',this)">Visão geral</button><button onclick="tab('lessons',this)">Aulas</button><button onclick="tab('comments',this)">Comentários</button></div>
<div id="overview" class="view"><div class="grid"><div class="card stat"><span>Aulas ativas</span><b id="n-lessons">0</b></div><div class="card stat"><span>Comentários</span><b id="n-comments">0</b></div><div class="card stat"><span>Aguardando resposta</span><b id="n-pending">0</b></div></div></div>
<div id="lessons" class="view hidden"><div class="card"><h2 id="form-title">Adicionar aula</h2><input id="lesson-id" type="hidden"><div class="row"><div><label>Módulo</label><input id="module" value="Material de Apoio"></div><div><label>Título</label><input id="title"></div><div><label>Duração</label><input id="duration" placeholder="Ex.: 12min ou PDF"></div><div><label>Tipo</label><select id="type"><option>CONTEÚDO</option><option>VÍDEO</option><option>PDF</option></select></div><div><label>Público</label><select id="audience" onchange="specificBox()"><option value="TODAS">Todas as alunas</option><option value="ESPECÍFICA">Uma aluna específica</option></select></div><div id="specific-box" class="hidden"><label>E-mail da aluna</label><input id="specific-email" type="email"></div><div><label>Ordem</label><input id="order" type="number" value="1"></div></div><label>Texto da aula</label><textarea id="body"></textarea><label>Material (URL)</label><input id="material-url"><label>Ou envie um PDF (máx. 10 MB)</label><input id="pdf" type="file" accept="application/pdf"><div class="actions"><button class="gold" onclick="saveLesson()">Salvar e publicar</button><button onclick="clearForm()">Limpar</button></div></div><div id="lesson-list" class="list"></div></div>
<div id="comments" class="view hidden"><div id="comment-list" class="list"></div></div><div id="msg"></div></section></main>
<script>
const API='https://script.google.com/macros/s/AKfycbxsOCNViKXjbDYT3vM_UBy0mem9TLPgyubTvWB6qWSO-4ja7HMZ0sFDuVlFE-_aHH9i/exec';let token=sessionStorage.getItem('nfn_admin_token')||'',data={lessons:[],comments:[]};const $=id=>document.getElementById(id);
async function post(body){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});return r.json()}
function note(text,ok=false,target='msg'){$(target).innerHTML='<div class="notice '+(ok?'ok':'err')+'">'+esc(text)+'</div>'}
async function sendCode(){let r=await post({action:'requestAdminCode',email:$('email').value});if(r.ok){$('code-box').classList.remove('hidden');note('Código enviado. Confira sua caixa de entrada.',true,'login-msg')}else note(r.error||'Não foi possível enviar.','', 'login-msg')}
async function verifyCode(){let r=await post({action:'verifyAdminCode',email:$('email').value,code:$('code').value});if(!r.ok)return note(r.error,'','login-msg');token=r.token;sessionStorage.setItem('nfn_admin_token',token);await load()}
async function load(){try{let r=await post({action:'listAdminData',token});if(!r.ok)throw Error(r.error);data=r;$('login').classList.add('hidden');$('panel').classList.remove('hidden');$('who').textContent='Sessão administrativa: '+r.admin;render()}catch(e){sessionStorage.removeItem('nfn_admin_token');token='';$('login').classList.remove('hidden');$('panel').classList.add('hidden')}}
function render(){$('n-lessons').textContent=data.lessons.filter(x=>x.status==='ATIVA').length;$('n-comments').textContent=data.comments.length;$('n-pending').textContent=data.comments.filter(x=>!x.reply).length;$('lesson-list').innerHTML=data.lessons.map(l=>'<div class="item"><div class="item-head"><div><b>'+esc(l.title)+'</b><div class="muted">'+esc(l.module)+' · '+esc(l.audience)+(l.specificEmail?' · '+esc(l.specificEmail):'')+' · '+esc(l.status)+'</div></div><b>#'+esc(l.order)+'</b></div><div class="actions"><button onclick="editLesson(\''+esc(l.id)+'\')">Editar</button>'+(l.status==='ATIVA'?'<button class="danger" onclick="archiveLesson(\''+esc(l.id)+'\')">Arquivar</button>':'')+'</div></div>').join('');$('comment-list').innerHTML=data.comments.length?data.comments.slice().reverse().map(c=>'<div class="item"><b>'+esc(c.name)+'</b> <span class="muted">'+esc(c.email)+'</span><p>'+esc(c.text)+'</p>'+(c.reply?'<div class="reply"><b>Resposta da Priscila:</b> '+esc(c.reply)+'</div>':'<textarea id="reply-'+esc(c.id)+'" placeholder="Escreva a resposta..."></textarea><button class="gold" onclick="reply(\''+esc(c.id)+'\')">Responder</button>')+'</div>').join(''):'<div class="card">Ainda não há comentários.</div>'}
function tab(id,b){document.querySelectorAll('.view').forEach(v=>v.classList.add('hidden'));$(id).classList.remove('hidden');document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active')}
function specificBox(){$('specific-box').classList.toggle('hidden',$('audience').value!=='ESPECÍFICA')}
async function saveLesson(){let url=$('material-url').value,file=$('pdf').files[0];if(file){note('Enviando PDF...',true);let base64=await new Promise((ok,no)=>{let f=new FileReader;f.onload=()=>ok(f.result.split(',')[1]);f.onerror=no;f.readAsDataURL(file)});let up=await post({action:'uploadPdf',token,fileName:file.name,mimeType:file.type,base64});if(!up.ok)return note(up.error);url=up.url}let lesson={id:$('lesson-id').value,module:$('module').value,title:$('title').value,duration:$('duration').value,type:$('type').value,body:$('body').value,materialUrl:url,audience:$('audience').value,specificEmail:$('specific-email').value,order:$('order').value};let r=await post({action:'saveLesson',token,lesson});if(!r.ok)return note(r.error);note('Aula publicada com sucesso.',true);clearForm();await load()}
function editLesson(id){let l=data.lessons.find(x=>x.id===id);['id','module','title','duration','type','audience','order'].forEach(k=>$(k==='id'?'lesson-id':k).value=l[k]||'');$('body').value=l.body||'';$('material-url').value=l.materialUrl||'';$('specific-email').value=l.specificEmail||'';specificBox();scrollTo({top:250,behavior:'smooth'})}
function clearForm(){['lesson-id','title','duration','body','material-url','specific-email'].forEach(id=>$(id).value='');$('pdf').value=''}
async function archiveLesson(id){if(!confirm('Arquivar esta aula? Ela deixará de aparecer para as alunas.'))return;let r=await post({action:'archiveLesson',token,id});if(r.ok)await load();else note(r.error)}
async function reply(id){let r=await post({action:'replyComment',token,id,reply:$('reply-'+id).value});if(r.ok)await load();else note(r.error)}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}if(token)load();
</script></body></html>
